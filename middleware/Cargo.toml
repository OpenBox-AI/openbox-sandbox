[package]
name = "openbox-verdict-middleware"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "LicenseRef-Proprietary"
description = "OpenBox verdicts for OpenShell sandbox egress (supervisor middleware)"

[[bin]]
name = "openbox-verdict-middleware"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
# Must stay on the same revision as the root crate; tests/pin.rs enforces it.
openshell-core = { version = "=0.0.0", git = "https://github.com/NVIDIA/OpenShell.git", rev = "6648bd0c290efbc41ba131ee9831ee45cd431f94", default-features = false }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
missing_fields_in_debug = "allow"
