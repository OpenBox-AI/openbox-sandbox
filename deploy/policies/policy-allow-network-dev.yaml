# NON-PRODUCTION development policy. Do NOT use in production.
# Identical to policy-deny-network.yaml except Landlock runs in best_effort mode:
# if the host kernel cannot provide Landlock, the sandbox degrades with a warning
# instead of failing closed. Container namespaces, cgroups, and seccomp still apply;
# only the Landlock filesystem-hardening layer may be absent.
# Admitted only when the service config sets allow_degraded_landlock: true.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
  read_write:
    - /sandbox
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  allow_outbound: true
