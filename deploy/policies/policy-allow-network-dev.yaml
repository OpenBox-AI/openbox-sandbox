# NON-PRODUCTION development policy. Do NOT use in production.
# Dev policy: allows ONLY curl to reach httpbin.org:443 — everything else
# stays blocked. The allowlist is scoped to the demo's egress target.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /tmp
  read_write:
    - /sandbox
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  httpbin_egress:
    name: httpbin-egress
    endpoints:
      - host: httpbin.org
        port: 443
    binaries:
      - path: /usr/bin/curl
