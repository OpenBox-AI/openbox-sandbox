# NON-PRODUCTION dev variant of policy-temporal-activity-worker.yaml:
# best_effort Landlock for hosts whose sandbox guest kernel lacks
# CONFIG_SECURITY_LANDLOCK (e.g. the macOS libkrun guest). Requires the
# service to opt in via allow_degraded_landlock=true.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /opt
    - /var/log
    - /dev/urandom
    - /tmp
  read_write:
    - /sandbox
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  temporal_activity_worker:
    name: temporal-activity-worker
    endpoints:
      - host: host.containers.internal
        port: 7233
    binaries:
      - path: /usr/bin/python3.11
