{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obx.credentialsSecret" . }}
  labels:
    {{- include "obx.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.credentials.apiKey | quote }}
  {{- if eq .Values.credentials.identity "workload" }}
  workload.pem: {{ .Values.credentials.workloadPrivateKey | quote }}
  workload-kid: {{ .Values.credentials.workloadKid | quote }}
  {{- end }}
  {{- if eq .Values.credentials.identity "signed" }}
  agent-key.pem: {{ .Values.credentials.agentPrivateKey | quote }}
  {{- end }}
{{- end }}
{{- if and (include "obx.hasRedis" .) (not .Values.externalRedis.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obx.redisSecret" . }}
  labels:
    {{- include "obx.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-url: {{ include "obx.redisUrl" . | quote }}
{{- end }}
{{- if not .Values.gateway.publicKeyConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obx.gatewayKeyConfigMap" . }}
  labels:
    {{- include "obx.labels" . | nindent 4 }}
data:
  public-key.pem: {{ .Values.gateway.publicKey | quote }}
{{- end }}
