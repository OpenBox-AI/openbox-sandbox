{{- if .Values.tls.certManager.enabled }}
{{- $cm := .Values.tls.certManager -}}
{{- range $component := list "doorGuard" "frontDesk" }}
{{- $name := ternary (include "obx.doorGuard" $) (include "obx.frontDesk" $) (eq $component "doorGuard") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
  labels:
    {{- include "obx.labels" $ | nindent 4 }}
spec:
  secretName: {{ $name }}-tls
  duration: {{ $cm.duration }}
  renewBefore: {{ $cm.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    {{- include "obx.dnsNames" (dict "root" $ "name" $name) | nindent 4 }}
  issuerRef:
    name: {{ $cm.issuerRef.name }}
    kind: {{ $cm.issuerRef.kind }}
    group: {{ $cm.issuerRef.group }}
{{- end }}
{{- end }}
