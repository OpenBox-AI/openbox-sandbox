name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  SYFT_VERSION: "v1.20.0"
  SYFT_INSTALLER_COMMIT: "46522bcc5dff8b65b61a7cda1393abe515802306"
  COSIGN_VERSION: "v2.5.3"
  LAUNCHER_DIR: packaging/launcher
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Build matrix: macOS aarch64, Linux amd64, Linux arm64
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: openbox-sandbox-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: openbox-sandbox-linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: openbox-sandbox-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install cross (Linux arm64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        working-directory: ${{ env.LAUNCHER_DIR }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross-compile)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: ${{ env.LAUNCHER_DIR }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN="${{ env.LAUNCHER_DIR }}/target/${{ matrix.target }}/release/obs"
          if [[ "${{ matrix.target }}" == "aarch64"* ]]; then
            sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip "$BIN"
            echo "Stripped $BIN (cross strip)"
          elif command -v strip &>/dev/null; then
            strip "$BIN"
            echo "Stripped $BIN"
          fi

      - name: Rename binary
        run: |
          SRC="${{ env.LAUNCHER_DIR }}/target/${{ matrix.target }}/release/obs"
          DST="${{ matrix.artifact }}"
          cp "$SRC" "$DST"
          echo "BINARY=$DST" >> "$GITHUB_ENV"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # SBOM: generate SPDX + CycloneDX, sign with cosign keyless
  # ──────────────────────────────────────────────────────────────────────
  sbom:
    name: sbom (${{ matrix.artifact }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: openbox-sandbox-darwin-arm64
          - artifact: openbox-sandbox-linux-amd64
          - artifact: openbox-sandbox-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Install syft
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${{ env.SYFT_INSTALLER_COMMIT }}/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${{ env.SYFT_VERSION }}"

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          chmod +x ${{ env.LAUNCHER_DIR }}/scripts/generate-sbom.sh
          ${{ env.LAUNCHER_DIR }}/scripts/generate-sbom.sh \
            "${{ matrix.artifact }}" \
            "sbom-output"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Keyless sign SBOM
        run: |
          set -euo pipefail
          cosign sign-blob \
            --bundle "sbom-output/${{ matrix.artifact }}.spdx.json.sbom.bundle.json" \
            --yes \
            "sbom-output/${{ matrix.artifact }}.spdx.json"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.artifact }}
          path: |
            sbom-output/${{ matrix.artifact }}.spdx.json
            sbom-output/${{ matrix.artifact }}.cyclonedx.json
            sbom-output/${{ matrix.artifact }}.spdx.json.sbom.bundle.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Scan: Trivy dependency scan + credential scan
  # ──────────────────────────────────────────────────────────────────────
  scan:
    name: security scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.LAUNCHER_DIR }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Credential scan
        run: |
          set -euo pipefail
          chmod +x ${{ env.LAUNCHER_DIR }}/scripts/scan-credentials.sh
          ${{ env.LAUNCHER_DIR }}/scripts/scan-credentials.sh "${{ env.LAUNCHER_DIR }}"

  # ──────────────────────────────────────────────────────────────────────
  # Manifest: SHA256SUMS + asset-manifest.json (tag pushes only)
  # ──────────────────────────────────────────────────────────────────────
  manifest:
    name: release manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sbom, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG does not match v*.*.*"; exit 1
          fi

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: openbox-sandbox-*
          merge-multiple: true

      - name: Download all SBOMs
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: sbom-*
          merge-multiple: true

      - name: Scan credentials in release dir
        run: |
          set -euo pipefail
          chmod +x ${{ env.LAUNCHER_DIR }}/scripts/scan-credentials.sh
          ${{ env.LAUNCHER_DIR }}/scripts/scan-credentials.sh release

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 openbox-sandbox-* > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Generate asset-manifest.json
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          TAG="${GITHUB_REF_NAME}"

          # Collect binary checksums
          BINARIES_JSON="{"
          FIRST=true
          for f in release/openbox-sandbox-*; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *.spdx.json ]] && continue
            [[ "$f" == *.cyclonedx.json ]] && continue
            [[ "$f" == *.sbom.bundle.json ]] && continue
            [[ "$f" == SHA256SUMS ]] && continue
            [[ "$f" == asset-manifest.json ]] && continue
            NAME="$(basename "$f")"
            SHA="$(shasum -a 256 "$f" | awk '{print $1}')"
            SBOM_SHA=""
            if [[ -f "release/${NAME}.spdx.json" ]]; then
              SBOM_SHA="$(shasum -a 256 "release/${NAME}.spdx.json" | awk '{print $1}')"
            fi
            BUNDLE_SHA=""
            if [[ -f "release/${NAME}.spdx.json.sbom.bundle.json" ]]; then
              BUNDLE_SHA="$(shasum -a 256 "release/${NAME}.spdx.json.sbom.bundle.json" | awk '{print $1}')"
            fi
            if [[ "$FIRST" == "true" ]]; then
              FIRST=false
            else
              BINARIES_JSON+=","
            fi
            BINARIES_JSON+="\"${NAME}\":{\"sha256\":\"${SHA}\""
            [[ -n "$SBOM_SHA" ]] && BINARIES_JSON+=",\"sbom_sha256\":\"${SBOM_SHA}\""
            [[ -n "$BUNDLE_SHA" ]] && BINARIES_JSON+=",\"cosign_bundle_sha256\":\"${BUNDLE_SHA}\""
            BINARIES_JSON+="}"
          done
          BINARIES_JSON+="}"

          PKG_COUNT=0
          SBOM_FORMAT="SPDX-2.3"
          SBOM_SHA=""
          for f in release/*.spdx.json; do
            [[ -f "$f" ]] || continue
            if command -v jq &>/dev/null; then
              PKG_COUNT="$(jq '.packages | length' "$f" 2>/dev/null || echo 0)"
            fi
            SBOM_SHA="$(shasum -a 256 "$f" | awk '{print $1}')"
            break
          done

          if command -v jq &>/dev/null; then
            jq -n \
              --arg ver "$TAG" \
              --arg commit "$COMMIT" \
              --arg rust "${{ env.RUST_TOOLCHAIN }}" \
              --arg syft "${{ env.SYFT_VERSION }}" \
              --arg cosign "${{ env.COSIGN_VERSION }}" \
              --arg run "${{ github.run_id }}" \
              --arg fmt "$SBOM_FORMAT" \
              --argjson pkg "$PKG_COUNT" \
              --arg sbom_sha "$SBOM_SHA" \
              --argjson bins "$BINARIES_JSON" \
              '{
                schema_version: 1,
                product: "openbox-sandbox",
                version: $ver,
                commit: $commit,
                build: { rust_toolchain: $rust, syft_version: $syft, cosign_version: $cosign, github_run: $run },
                supply_chain: { sbom: { format: $fmt, package_count: $pkg, sha256: $sbom_sha }, signature: { method: "cosign-keyless-oidc", verified: true } },
                binaries: $bins
              }' > release/asset-manifest.json
          else
            cat > release/asset-manifest.json <<MANIFEST_EOF
          {"schema_version":1,"product":"openbox-sandbox","version":"${TAG}","commit":"${COMMIT}","supply_chain":{"sbom":{"format":"${SBOM_FORMAT}","package_count":${PKG_COUNT},"sha256":"${SBOM_SHA}"},"signature":{"method":"cosign-keyless-oidc","verified":true}},"binaries":${BINARIES_JSON}}
          MANIFEST_EOF
          fi
          echo "=== asset-manifest.json ==="
          cat release/asset-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/openbox-sandbox-*
            release/SHA256SUMS
            release/asset-manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Verify: download + checksum + SBOM compare (tag pushes only)
  # ──────────────────────────────────────────────────────────────────────
  verify:
    name: verify release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Download SHA256SUMS from release
          gh release download "$TAG" --pattern SHA256SUMS --dir verify
          # Download one binary for verification
          gh release download "$TAG" --pattern "openbox-sandbox-linux-amd64" --dir verify
          # Download its SBOM
          gh release download "$TAG" --pattern "openbox-sandbox-linux-amd64.spdx.json" --dir verify || true
          # Download asset manifest
          gh release download "$TAG" --pattern "asset-manifest.json" --dir verify || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify checksum
        run: |
          set -euo pipefail
          cd verify
          shasum -a 256 -c SHA256SUMS

      - name: Verify SBOM matches binary
        run: |
          set -euo pipefail
          # Install syft from the reviewed immutable installer revision.
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${{ env.SYFT_INSTALLER_COMMIT }}/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${{ env.SYFT_VERSION }}"

          cd verify
          # Generate fresh SBOM from downloaded binary
          syft openbox-sandbox-linux-amd64 -o spdx-json=local-check.spdx.json

          # Compare with published SBOM (structural check — field order may differ)
          if command -v jq &>/dev/null; then
            DIFF=$(diff <(jq -S . openbox-sandbox-linux-amd64.spdx.json) <(jq -S . local-check.spdx.json) || true)
            if [[ -n "$DIFF" ]]; then
              echo "WARNING: SBOM structural differences detected"
              echo "$DIFF" | head -20
              # Don't fail — syft version differences may cause minor variations
            else
              echo "SBOM matches published version"
            fi
          else
            echo "jq not installed — skipping SBOM structural comparison"
          fi

      - name: Smoke test binary
        run: |
          set -euo pipefail
          chmod +x verify/openbox-sandbox-linux-amd64
          verify/openbox-sandbox-linux-amd64 --help
          verify/openbox-sandbox-linux-amd64 --verify-runtime || true

      - name: Verify asset manifest
        run: |
          set -euo pipefail
          if [[ -f verify/asset-manifest.json ]]; then
            echo "=== asset-manifest.json ==="
            cat verify/asset-manifest.json
            if command -v jq &>/dev/null; then
              echo ""
              echo "Supply chain summary:"
              jq -r '.supply_chain | to_entries[] | "  \(.key): \(.value)"' verify/asset-manifest.json
              echo ""
              echo "Binaries:"
              jq -r '.binaries | to_entries[] | "  \(.key): sha256=\(.value.sha256[0:16])..."' verify/asset-manifest.json
            fi
          else
            echo "asset-manifest.json not found (optional)"
          fi
