name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  launcher-tests:
    name: launcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run launcher script tests
        run: |
          set -euo pipefail
          # test-provision-local-sandbox.sh compiles a C fixture for the
          # gateway-ownership checks; ubuntu runners have no compiler by default.
          sudo apt-get update
          sudo apt-get install -y gcc
          for t in test-generate-sbom.sh test-verify-release.sh test-provision-local-sandbox.sh; do
            echo "=== running $t"
            bash -x "packaging/launcher/scripts/$t"
          done

  deny:
    name: cargo deny (licenses · advisories · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: taiki-e/install-action@2ce5577e7dcdd7504d849e3cd211c18c81fa3ab1
        with:
          tool: cargo-deny@0.20.2
      - name: Check licenses, advisories, and sources
        # deny.toml is auto-discovered from the repo root; --config placement
        # differs across cargo-deny CLI generations, so it is omitted.
        run: cargo deny check licenses advisories sources
