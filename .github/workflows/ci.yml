name: ci

# Every gate here already existed and was documented in the README. Nothing
# ran them, so a CVE, a failing clippy, and a stale README all shipped. This
# workflow is what makes the documented checks true.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failed build should not be retried silently on a flaky network.
  CARGO_NET_RETRY: 0
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the production target. macOS is where the native provider
        # uses Seatbelt and the unified log, which no Linux runner exercises.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version, so rustup installs it here.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # First-party cache action, deliberately: this repository verifies what
      # it consumes, so CI should not pull a third-party action to do it.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            packaging/launcher/target
            packaging/release/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path packaging/launcher/Cargo.toml -- --check
          cargo fmt --manifest-path packaging/release/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path packaging/launcher/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path packaging/release/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --all-features
          cargo test --manifest-path packaging/launcher/Cargo.toml
          cargo test --manifest-path packaging/release/Cargo.toml

      - name: Build the service and the launcher
        run: |
          cargo build --release --locked --bin openbox-sandbox
          cargo build --release --manifest-path packaging/launcher/Cargo.toml

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-deny-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}
          restore-keys: ${{ runner.os }}-deny-

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      # This is the check that was failing on RUSTSEC-2026-0258 while the
      # README listed it as passing.
      - name: Advisories, bans, licences, sources
        run: cargo deny check
