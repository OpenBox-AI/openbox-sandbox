[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# GHSA-gfxp-f68g-8x78 (libyml <=0.0.5, yaml_string_extend unsound): transitive
# via the LOCKED upstream openshell-policy crate (serde_yml 0.0.12); no
# patched libyml exists and the pin cannot be changed here. Reachable only by
# parsing operator-supplied policy YAML at provision time — not by sandbox
# workloads. Revisit when the OpenShell lock bumps.
ignore = [
  { id = "GHSA-gfxp-f68g-8x78", reason = "locked upstream openshell-policy dep; no patched release; operator-controlled input only" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Keep the explicit allow list stable for this private runtime workspace.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []

[licenses.private]
# Workspace crates are proprietary and explicitly non-publishable. Third-party
# dependencies remain subject to the allow list above.
ignore = true

[bans]
multiple-versions = "warn"
# The pinned upstream openshell-policy crate contains an internal path-only dependency without a
# version field. Keep this visible as a warning; Cargo.toml and Cargo.lock bind the exact Git
# revision used by this workspace.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/NVIDIA/OpenShell.git"]
