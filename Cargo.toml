[package]
name = "openbox-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "LicenseRef-Proprietary"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "openbox-sandbox"
path = "src/main.rs"

[features]
default = ["serde"]
serde = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
openshell-core = { version = "=0.0.0", git = "https://github.com/NVIDIA/OpenShell.git", rev = "f169084923503a02a94425857b938de2841cab0c", default-features = false }
openshell-policy = { version = "=0.0.0", git = "https://github.com/NVIDIA/OpenShell.git", rev = "f169084923503a02a94425857b938de2841cab0c" }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
rcgen = "0.14"
static_assertions = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
missing_fields_in_debug = "allow"
